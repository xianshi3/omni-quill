name: Release

# 推送 v* 标签时自动构建全平台版本并发布 GitHub Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            asset: win-x64
          - os: ubuntu-latest
            rid: linux-x64
            asset: linux-x64
          - os: macos-latest
            rid: osx-x64
            asset: osx-x64
          - os: macos-latest
            rid: osx-arm64
            asset: osx-arm64

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish (self-contained)
        run: >
          dotnet publish OmniQuill.Desktop/OmniQuill.Desktop.csproj
          -c Release
          -r ${{ matrix.rid }}
          --self-contained true
          -o publish/OmniQuill-${{ matrix.asset }}

      # Windows 用 Compress-Archive；macOS/Linux 用 zip 以保留可执行权限位
      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: >
          Compress-Archive
          -Path publish/OmniQuill-${{ matrix.asset }}
          -DestinationPath OmniQuill-${{ matrix.asset }}.zip
          -Force

      - name: Package (macOS/Linux)
        if: runner.os != 'Windows'
        working-directory: publish
        run: zip -rq ../OmniQuill-${{ matrix.asset }}.zip OmniQuill-${{ matrix.asset }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OmniQuill-${{ matrix.asset }}
          path: OmniQuill-${{ matrix.asset }}.zip
          if-no-files-found: error

  release:
    name: Publish Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --title "OmniQuill $GITHUB_REF_NAME" \
              --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/*.zip --repo "$GITHUB_REPOSITORY" --clobber
